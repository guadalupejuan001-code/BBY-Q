plugins { id 'com.android.application' }
android {
 namespace 'com.bbyq.personal'
 compileSdk 35
 ndkVersion '27.2.12479018'
 defaultConfig {
  applicationId 'com.bbyq.personalx'
  minSdk 29
  targetSdk 35
  versionCode 1
  versionName '1.0.0-personal'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  ndk { abiFilters 'arm64-v8a','x86_64' }
  externalNativeBuild { cmake { cppFlags '-std=c++17 -fexceptions -frtti' } }
 }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 buildTypes { debug { debuggable false }; release { minifyEnabled false } }
}
dependencies {
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
