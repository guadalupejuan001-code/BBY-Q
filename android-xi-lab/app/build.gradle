plugins { id 'com.android.application' }
android {
    namespace 'com.bbyq.lab'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bbyq.xilab'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0-c13-lab'
        ndk { abiFilters 'arm64-v8a','x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -fexceptions -frtti' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
