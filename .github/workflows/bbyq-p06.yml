name: BBY Q P06 productive paraphrase generalization in native XI
on:
  push:
    branches: [feature/bbyq-p06-paraphrase-xi-20261031, main]
    paths:
      - 'ai/personal/p06/**'
      - 'ai/personal/x10/**'
      - 'integration/p06/**'
      - 'integration/x10/prepare.mjs'
      - 'bbyq.mjs'
      - '.github/workflows/bbyq-p06.yml'
  pull_request:
    paths:
      - 'ai/personal/p06/**'
      - 'ai/personal/x10/**'
      - 'integration/p06/**'
      - 'integration/x10/prepare.mjs'
      - 'bbyq.mjs'
      - '.github/workflows/bbyq-p06.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-paraphrases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.22.1'}
      - name: Verify source, syntax, safety and backward-compatible contracts
        run: |
          set -euo pipefail
          for f in ai/personal/p06/*.mjs integration/p06/tests/*.mjs ai/personal/x10/{pages,session}.mjs integration/x10/prepare.mjs bbyq.mjs; do node --check "$f"; done
          node --test integration/p01/tests/contracts.test.mjs integration/p02/tests/contracts.test.mjs integration/p03/tests/contracts.test.mjs integration/p04/tests/contracts.test.mjs integration/p05/tests/contracts.test.mjs integration/p06/tests/contracts.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: a1b935ae0adf38615996bac92727e95289ad7cc1
          path: deps/reverse
          persist-credentials: false
      - name: Compile pinned native XI runtime
        run: |
          set -euo pipefail
          bash deps/reverse/scripts/setup-ether.sh
          cd deps/reverse
          mkdir -p build
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc src/reverse_pc.cpp -o build/reverse_pc
      - name: Native XI grammar, all rule families, held-out topics and negative semantic controls
        run: node integration/p06/tests/native.mjs deps/reverse/build/reverse_pc build/p06-native
      - name: Verify actual X10 routing into P05/P04/P03 with rollback and preserved memory
        run: node integration/p06/tests/cli.mjs deps/reverse/build/reverse_pc build/p06-cli
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBYQ-P06-XI-generalization-evidence
          path: |
            build/p06-native/results.json
            build/p06-cli/results.json
          retention-days: 14
