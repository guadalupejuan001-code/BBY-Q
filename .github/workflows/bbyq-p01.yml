name: BBY Q P01 intent classifier (native XI)
on:
  pull_request:
    paths:
      - 'ai/personal/p01/**'
      - 'ai/personal/x10/**'
      - 'integration/p01/**'
      - 'integration/x10/prepare.mjs'
      - '.github/workflows/bbyq-p01.yml'
  push:
    branches:
      - main
      - feature/bbyq-p01-intent-20261031
    paths:
      - 'ai/personal/p01/**'
      - 'ai/personal/x10/**'
      - 'integration/p01/**'
      - 'integration/x10/prepare.mjs'
      - '.github/workflows/bbyq-p01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-intents:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Check P01 and X10 module syntax
        run: |
          node --check ai/personal/p01/intent.mjs
          node --check ai/personal/x10/pages.mjs
          node --check ai/personal/x10/session.mjs
          node --check integration/x10/prepare.mjs
          node --check integration/p01/tests/native.mjs
          node --test integration/p01/tests/contracts.test.mjs
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: 03c255fc920979f4d6b928f05ebd930d01fff1b5
          path: deps/reverse
          persist-credentials: false
      - name: Build original native XI runtime (pinned)
        run: |
          set -euo pipefail
          bash deps/reverse/scripts/setup-ether.sh
          cd deps/reverse
          mkdir -p build
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc src/reverse_pc.cpp -o build/reverse_pc
      - name: Compile and examine P01 in native XI
        run: node integration/p01/tests/native.mjs deps/reverse/build/reverse_pc build/p01-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBY-Q-P01-native-evidence
          path: build/p01-results/results.json
          retention-days: 14
