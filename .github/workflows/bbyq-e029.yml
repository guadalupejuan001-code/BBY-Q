name: BBY Q E029 conversational fact learning (XI)
on:
  pull_request:
    paths: ['ai/releases/e031/**', 'ai/releases/e030/**', 'docs/AI_E030_LEARNED_FRAMES.md', 'ai/releases/e029/**', 'docs/AI_E029_NATURAL_INTAKE.md', '.github/workflows/bbyq-e029.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bbyq-e029-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  native-e029:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: a1b935ae0adf38615996bac92727e95289ad7cc1
          path: deps/reverse
          persist-credentials: false
      - name: Build pinned XI/Ether runtime
        run: |
          set -euo pipefail
          bash deps/reverse/scripts/setup-ether.sh
          cd deps/reverse
          mkdir -p build
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc src/reverse_pc.cpp -o build/reverse_pc
      - name: Original E025 and W4u native regressions
        run: |
          set -euo pipefail
          python3 ai/releases/e025/test.py deps/reverse/build/reverse_pc evidence/e025
          node ai/xi/w4u/tests/native-w4u.mjs deps/reverse/build/reverse_pc evidence/w4u
      - name: Checkout full pinned bilingual Wordnet data
        uses: actions/checkout@v4
        with:
          repository: omwn/omw-data
          ref: 406bf83b3c507a3d1f26e88252d5d66893fd36bf
          path: deps/omw
          persist-credentials: false
      - name: Checkout original English WordNet gloss data only
        uses: actions/checkout@v4
        with:
          repository: nltk/wordnet
          ref: ce91915ae38a341ae845be4d825ef6003cddf395
          path: deps/wordnet
          persist-credentials: false
          sparse-checkout: wn/data/wordnet-3.0
      - name: Import complete sources and examine native dictionary
        run: python3 ai/releases/e031/import_and_test.py deps/reverse/build/reverse_pc deps/omw evidence/dictionary
      - name: Candidate old knowledge and W4u regression
        run: python3 ai/releases/e031/regression.py deps/reverse/build/reverse_pc evidence/dictionary evidence/candidate-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBYQ-E031-full-bilingual-dictionary
          path: evidence
