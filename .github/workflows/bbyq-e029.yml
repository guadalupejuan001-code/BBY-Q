name: BBY Q E029 conversational fact learning (XI)
on:
  pull_request:
    paths: ['ai/releases/e032/**', 'ai/releases/e031/**', 'ai/releases/e030/**', 'docs/AI_E030_LEARNED_FRAMES.md', 'ai/releases/e029/**', 'docs/AI_E029_NATURAL_INTAKE.md', '.github/workflows/bbyq-e029.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bbyq-e029-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  native-e029:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: a1b935ae0adf38615996bac92727e95289ad7cc1
          path: deps/reverse
          persist-credentials: false
      - name: Build pinned XI/Ether runtime
        run: |
          set -euo pipefail
          bash deps/reverse/scripts/setup-ether.sh
          cd deps/reverse
          mkdir -p build
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc src/reverse_pc.cpp -o build/reverse_pc
      - name: Original E025 and W4u native regressions
        run: |
          set -euo pipefail
          python3 ai/releases/e025/test.py deps/reverse/build/reverse_pc evidence/e025
          node ai/xi/w4u/tests/native-w4u.mjs deps/reverse/build/reverse_pc evidence/w4u
      - name: Recover exact existing E031 candidate and dictionary
        uses: actions/download-artifact@v4
        with:
          name: BBYQ-E031-full-bilingual-dictionary
          run-id: 40793126384
          github-token: ${{ github.token }}
          path: prior
      - name: Build and verify native temporal candidate
        run: python3 ai/releases/e032/build.py deps/reverse/build/reverse_pc prior evidence/temporal
      - name: Teach and independently examine temporal language in XI
        run: python3 ai/releases/e032/test.py deps/reverse/build/reverse_pc prior evidence/temporal
      - name: Prior agent and W4u regressions on temporal capsule
        run: |
          mkdir -p evidence/temporal-compat
          cp evidence/temporal/temporal.rxe evidence/temporal-compat/dictionary.rxe
          cp prior/dictionary/controller.rvp evidence/temporal-compat/controller.rvp
          python3 ai/releases/e031/regression.py deps/reverse/build/reverse_pc evidence/temporal-compat evidence/candidate-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBYQ-E032-native-temporal-learning
          path: evidence
