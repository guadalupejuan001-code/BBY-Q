name: BBY Q E029 conversational fact learning (XI)
on:
  pull_request:
    paths: ['ai/releases/e029/**', 'docs/AI_E029_NATURAL_INTAKE.md', '.github/workflows/bbyq-e029.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bbyq-e029-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  native-e029:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: a1b935ae0adf38615996bac92727e95289ad7cc1
          path: deps/reverse
          persist-credentials: false
      - name: Build pinned XI/Ether runtime
        run: |
          set -euo pipefail
          bash deps/reverse/scripts/setup-ether.sh
          cd deps/reverse
          mkdir -p build
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc src/reverse_pc.cpp -o build/reverse_pc
      - name: Original E025 and W4u native regressions
        run: |
          set -euo pipefail
          python3 ai/releases/e025/test.py deps/reverse/build/reverse_pc evidence/e025
          node ai/xi/w4u/tests/native-w4u.mjs deps/reverse/build/reverse_pc evidence/w4u
      - name: Reproduce E027 and build separate E029 from E028
        run: |
          set -euo pipefail
          node ai/releases/e027/build.mjs deps/reverse/build/reverse_pc evidence/e027-original
          node ai/releases/e029/build.mjs deps/reverse/build/reverse_pc evidence/e029
          mkdir -p evidence/e029-compat
          cp evidence/e029/natural.rxe evidence/e029-compat/candidate.rxe
          cp evidence/e029/controller.rvp evidence/e029-compat/controller.rvp
      - name: Exercise natural XI conversational fact acquisition
        run: |
          set -euo pipefail
          node ai/releases/e029/test.mjs deps/reverse/build/reverse_pc evidence/e029 evidence/e029-natural-tests
      - name: E028 entity and composition regressions with E029
        run: |
          set -euo pipefail
          node ai/releases/e028/test.mjs deps/reverse/build/reverse_pc evidence/e029-compat evidence/e027-original evidence/e029-e028-regression
      - name: E027 full archive regression with E029
        run: |
          set -euo pipefail
          node ai/releases/e027/test.mjs deps/reverse/build/reverse_pc evidence/e029-compat evidence/e029-e027-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBYQ-E029-XI-natural-facts-evidence
          path: |
            evidence/e025/tests.json
            evidence/e025/verification.json
            evidence/w4u/results.json
            evidence/e029/natural.json
            evidence/e029-natural-tests/results.json
            evidence/e029-e028-regression/results.json
            evidence/e029-e027-regression/tests.json
