name: BBY Q E017 - supervised open dialogue foundations in XI
on:
  push:
    branches: [feature/bbyq-e017-open-learning-20261026, main]
    paths: ["ai/xi/open/**", "ai/xi/knowledge/**", "ai/xi/conversation/**", "ai/xi/dialogue/**", "ai/xi/stories/**", "ai/xi/grammar/**", "ai/native/**", "ai/checkpoints/BBYQ_E017*", "ai/checkpoints/e017-manifest.json", ".github/workflows/bbyq-e017.yml"]
  pull_request:
    paths: ["ai/xi/open/**", "ai/xi/knowledge/**", "ai/xi/conversation/**", "ai/xi/dialogue/**", "ai/xi/stories/**", "ai/xi/grammar/**", "ai/native/**", "ai/checkpoints/BBYQ_E017*", "ai/checkpoints/e017-manifest.json", ".github/workflows/bbyq-e017.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-open:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore authentic E016 parent and E017 release
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ai/checkpoints/BBYQ_E016_Conversation_ES_EN.rvp.gz.b64 | gzip -dc > parent.rvp
          base64 -d ai/checkpoints/BBYQ_E017_Open_Learning_ES_EN.rvp.gz.b64 | gzip -dc > released.rvp
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('ai/checkpoints/e017-manifest.json').read_text())
          assert hashlib.sha256(Path('parent.rvp').read_bytes()).hexdigest()==m['parent_sha256']
          assert hashlib.sha256(Path('released.rvp').read_bytes()).hexdigest()==m['decoded_sha256']
          for name,digest in m['source_data_sha256'].items():
              assert hashlib.sha256((Path('ai/xi/open/data')/name).read_bytes()).hexdigest()==digest
          PY
      - name: Build exact owner runtime and byte transport
        run: |
          set -eu
          git clone --no-checkout https://github.com/guadalupejuan001-code/REVERSE-PC.git "$RUNNER_TEMP/reverse-pc"
          git -C "$RUNNER_TEMP/reverse-pc" checkout --detach 6d4de14a2dfbce4b8a7f1cb50e29d11b9073fe98
          bash "$RUNNER_TEMP/reverse-pc/scripts/setup-ether.sh"
          cmake -S "$RUNNER_TEMP/reverse-pc" -B "$RUNNER_TEMP/reverse-pc-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/reverse-pc-build" --target reverse_pc --parallel 2
          bash ai/native/build-session.sh "$RUNNER_TEMP/reverse-pc" "$RUNNER_TEMP/session-build"
      - name: Train constructions and examine novel dialogue, reasoning and preserved knowledge
        shell: bash
        run: |
          set -euo pipefail
          python3 ai/xi/open/tests/native-open.py "$RUNNER_TEMP/reverse-pc-build/reverse_pc" "$RUNNER_TEMP/session-build/bbyq_session" parent.rvp --out evidence/e017 --cases 80 --terms 280
          python3 - <<'PY'
          import runpy
          snapshot=runpy.run_path('ai/xi/knowledge/tests/native-knowledge.py')['snapshot']
          assert snapshot('released.rvp')==snapshot('evidence/e017/BBYQ_E017_Open_Learning_ES_EN.rvp')
          PY
          bash -n ai/xi/knowledge/link.sh ai/xi/knowledge/text.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbyq-e017-open-learning-evidence
          path: |
            evidence/e017/results.json
            evidence/e017/raw.jsonl
            evidence/e017/diagnostic.json
            evidence/e017/BBYQ_E017_Open_Learning_ES_EN.rvp
          if-no-files-found: warn
