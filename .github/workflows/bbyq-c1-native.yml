name: BBY Q C1 native correction campaign
on:
  pull_request:
    paths: ['integration/sequence2/**', 'ai/xi/sequence2/**', 'bbyq.mjs', '.github/workflows/bbyq-c1-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: 08c363e6c6855c14026c86046af7183a45f45a98
          path: deps/reverse-pc
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Build the original XI and Ether runtime
        run: bash deps/reverse-pc/scripts/build-xi-session.sh deps/mundo-x deps/reverse-pc/build
      - name: Verify exact codec, tools, frozen identities and atomic tasks
        run: |
          python3 integration/sequence2/verify_curriculum.py
          python3 integration/sequence2/verify_codec.py
          python3 integration/sequence2/verify_tools.py
          python3 integration/sequence2/verify_release.py
          python3 integration/sequence2/verify_workspace.py
          python3 integration/sequence2/evaluate.py --per-family 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBYQ-C1-native-evidence
          path: |
            build/sequence2/*checks.json
            build/sequence2/tasks-validation.json
          if-no-files-found: warn
          retention-days: 30
