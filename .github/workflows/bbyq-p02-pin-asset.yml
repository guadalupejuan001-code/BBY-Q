name: BBY Q P02 pin verified E034 capsule in repository
on:
  push:
    branches: [feature/bbyq-p02-e034-bridge-20261031]
    paths: ['.github/workflows/bbyq-p02-pin-asset.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  pin-capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: BBYQ-E034-relational-composition
          run-id: 40808605984
          github-token: ${{ github.token }}
          path: deps/e034
      - name: Verify and encode exact proven capsule
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,hashlib
          from pathlib import Path
          src=Path('deps/e034/composition/composed.rxe')
          binary=src.read_bytes()
          assert hashlib.sha256(binary).hexdigest()=='a0edbe6122beb5ab57d0e2dbd60c26524bc946737806eb71f2ed133fde068a28'
          dst=Path('ai/releases/e034/composed.rxe.gz.b64')
          packed=gzip.compress(binary,compresslevel=9,mtime=0)
          dst.write_text(base64.b64encode(packed).decode('ascii')+'\n')
          assert gzip.decompress(base64.b64decode(dst.read_text()))==binary
          print('P02 pinned historical compiled program:',len(binary),'bytes; encoded',dst.stat().st_size,'bytes')
          PY
      - name: Publish the immutable capsule to this feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/releases/e034/composed.rxe.gz.b64
          if git diff --cached --quiet; then
            echo "P02 capsule already pinned"
          else
            git commit -m "P02: preserve SHA-verified E034 native capsule as compressed source asset"
            git push origin HEAD:feature/bbyq-p02-e034-bridge-20261031
          fi
