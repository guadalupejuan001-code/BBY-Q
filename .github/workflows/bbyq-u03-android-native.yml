name: BBY Q 0 persistent chats and context
on:
  pull_request:
    paths:
      - 'android-u03/**'
      - '.github/workflows/bbyq-u03-android-native.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bbyq-integrated-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  android-c19:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: 08c363e6c6855c14026c86046af7183a45f45a98
          path: deps/reverse-pc
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: M01 preserve 159 originals and build pinned XI C1 Zero
        run: |
          mkdir -p build/android-c19
          python3 - <<'PY'
          from integration.audit_u03_c00.profile import freeze_assets
          import json
          from pathlib import Path
          hashes=freeze_assets()
          assert len(hashes)==159
          Path('build/android-c19/protected-before.json').write_text(json.dumps(hashes,sort_keys=True))
          PY
          bash deps/reverse-pc/scripts/build-xi-session.sh deps/mundo-x deps/reverse-pc/build
          python3 deps/reverse-pc/scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          python3 integration/sequence2/build.py
          node integration/zero/build.mjs
          python3 -m integration.unified.verify_release
          python3 -m integration.unified.verify_perception
      - name: M03 recover original trained C06 C07 C08 checkpoints without retraining
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 android-u03/scripts/recover-mobile-heads.py
      - name: M02-M05 package actual source routes and authenticated heads
        run: |
          python3 android-u03/scripts/package-runtime.py
          python3 -m compileall -q android-u03/app/src/main/python android-u03/scripts
          python3 - <<'PY'
          from integration.audit_u03_c00.profile import freeze_assets
          import json
          from pathlib import Path
          assert freeze_assets()==json.loads(Path('build/android-c19/protected-before.json').read_text())
          print('159 protected original assets remain byte-identical; recovered heads are additive')
          PY
      - name: Install Android 35 build tools, Android 16 emulator and NDK27
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'platform-tools' 'emulator' 'system-images;android-36;default;x86_64'
      - name: C19 compile persistent chats, model workspace and original XI JNI
        run: |
          mkdir -p build/chat-upgrade-fixture
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore build/chat-upgrade-fixture/ci-debug.p12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=BBY Q CI,OU=Android tests,O=BBY Q,C=US'
          gradle -p android-u03 --no-daemon -PbbyqCiKeystorePath="$PWD/build/chat-upgrade-fixture/ci-debug.p12" :app:assembleDebug :app:assembleDebugAndroidTest > build/android-c19/gradle.log 2>&1 || {
            grep -n -E 'error:|FAILED|FAILURE|Caused by|Could not' build/android-c19/gradle.log | head -70 || true
            tail -160 build/android-c19/gradle.log
            exit 1
          }
          cp android-u03/app/build/outputs/apk/debug/app-debug.apk build/android-c19/BBY-Q-0-Chats.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs build/android-c19/BBY-Q-0-Chats.apk > build/android-c19/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build/android-c19/BBY-Q-0-Chats.apk > build/android-c19/package.txt
          grep "package: name='com.bbyq.u03.training'" build/android-c19/package.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 build/android-c19/BBY-Q-0-Chats.apk > build/android-c19/zipalignment.txt
          python3 android-u03/scripts/verify-integrated-apk.py build/android-c19/BBY-Q-0-Chats.apk build/android-c19/static-verification.json
          mkdir -p build/android-c19/signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/android-c19/signing-tool/apksigner.jar
      - name: Authenticate C18 APK for an actual data-preserving update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 android-u03/scripts/prepare-chat-upgrade.py "$ANDROID_HOME/build-tools/35.0.0" "$PWD/build/chat-upgrade-fixture/ci-debug.p12"
      - name: C19 Android 16 upgrade, chat continuity, context, training and restart
        timeout-minutes: 40
        run: bash android-u03/scripts/emulator-integrated.sh
      - name: Final source preservation and real Android report gates
        run: |
          python3 - <<'PY'
          from integration.audit_u03_c00.profile import freeze_assets
          from pathlib import Path
          import json
          out=Path('build/android-c19')
          assert freeze_assets()==json.loads((out/'protected-before.json').read_text())
          r=json.loads((out/'validation.json').read_text())
          assert r['delivery_verified'] and r['android_instrumentation_passed']
          assert r['android_instrumentation_test_count']>=16
          assert r['external_force_stop_restart_verified']
          assert r['training_instrumentation_passed']
          assert r['training_instrumentation_test_count']>=5
          assert r['personal_interface_verified']
          assert r['personal_interface_test_count']>=5
          assert r['chat_continuity_verified']
          assert r['chat_continuity_test_count']>=4
          assert r['actual_C18_to_C19_upgrade_verified']
          assert r['chat_workspace_packaged']
          assert r['android_api_tested']==36
          assert r['training_restart_evidence']['verify']['conversation_survived_process_restart']
          assert r['training_external_restart_verified']
          assert r['training_workspace_packaged'] and r['offline_illustrated_guide']
          assert r['all_ELF_load_segments_at_least_16KB']
          assert len(r['cycle_labs'])==8
          for c in ('c11','c12'):
              lab=json.loads((out/'lab'/(c+'.json')).read_text())
              assert lab['changed_regions']==6 and not lab['model_promoted']
          print('BBY Q 0 persistent chats, local context, actual C18 upgrade and original training verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBY-Q-0-Chats-APK-and-proof
          path: |
            build/android-c19/
            integration/mobile_u03_c16/heads/
          if-no-files-found: warn
          retention-days: 30

