name: BBY Q E022 - learned compositional query rewrites
on:
  push:
    branches: [main]
    paths: ["ai/xi/rephrase/**", "ai/xi/knowledge/**", "ai/xi/open/**", "ai/xi/lingua/**", "ai/xi/stories/**", "ai/native/**", "ai/checkpoints/BBYQ_E022*", "ai/checkpoints/e022-manifest.json", ".github/workflows/bbyq-e022.yml"]
  pull_request:
    paths: ["ai/xi/rephrase/**", "ai/xi/knowledge/**", "ai/xi/open/**", "ai/xi/lingua/**", "ai/xi/stories/**", "ai/native/**", "ai/checkpoints/BBYQ_E022*", "ai/checkpoints/e022-manifest.json", ".github/workflows/bbyq-e022.yml"]
  workflow_dispatch:
concurrency:
  group: bbyq-e022-native
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  compositional-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify authentic E021 parent, E022 checkpoint and curriculum
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ai/checkpoints/BBYQ_E021_Language_Dialogue_ES_EN.rvp.gz.b64 | gzip -dc > parent.rvp
          base64 -d ai/checkpoints/BBYQ_E022_Compositional_Requests_ES_EN.rvp.gz.b64 | gzip -dc > released.rvp
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('ai/checkpoints/e022-manifest.json').read_text())
          assert hashlib.sha256(Path('parent.rvp').read_bytes()).hexdigest()==m['parent_sha256']
          assert hashlib.sha256(Path('released.rvp').read_bytes()).hexdigest()==m['decoded_sha256']
          for name,digest in m['source_data_sha256'].items():
              assert hashlib.sha256((Path('ai/xi/rephrase')/name).read_bytes()).hexdigest()==digest
          for name,digest in m['integration_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest
          PY
      - name: Build unchanged pinned owner runtime and native byte transport
        run: |
          set -eu
          git clone --no-checkout https://github.com/guadalupejuan001-code/REVERSE-PC.git "$RUNNER_TEMP/reverse-pc"
          git -C "$RUNNER_TEMP/reverse-pc" checkout --detach 6d4de14a2dfbce4b8a7f1cb50e29d11b9073fe98
          bash "$RUNNER_TEMP/reverse-pc/scripts/setup-ether.sh"
          cmake -S "$RUNNER_TEMP/reverse-pc" -B "$RUNNER_TEMP/reverse-pc-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/reverse-pc-build" --target reverse_pc --parallel 2
          bash ai/native/build-session.sh "$RUNNER_TEMP/reverse-pc" "$RUNNER_TEMP/session-build"
      - name: Train paired rewrites, examine new compositions and retain prior skills
        shell: bash
        run: |
          set -euo pipefail
          python3 ai/xi/rephrase/tests/native-e022.py "$RUNNER_TEMP/reverse-pc-build/reverse_pc" "$RUNNER_TEMP/session-build/bbyq_session" --out evidence/e022
          python3 - <<'PY'
          import json,runpy
          snapshot=runpy.run_path('ai/xi/knowledge/tests/native-knowledge.py')['snapshot']
          assert snapshot('released.rvp')==snapshot('evidence/e022/BBYQ_E022_Compositional_Requests_ES_EN.rvp')
          m=json.load(open('ai/checkpoints/e022-manifest.json'));r=json.load(open('evidence/e022/results.json'))
          assert r['checks']==m['checks']
          assert r['training']['paired_examples']==39
          assert r['training']['learned_rewrite_rules']==33
          assert r['comparison'][-1]['heldout_compositions']=={'correct':110,'total':110}
          assert r['comparison'][-1]['development_16']=={'correct':16,'total':16}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bbyq-e022-composition-evidence
          path: |
            evidence/e022/results.json
            evidence/e022/comparisons.json
            evidence/e022/raw.jsonl
            evidence/e022/BBYQ_E022_Compositional_Requests_ES_EN.rvp
          if-no-files-found: warn
