name: Integrated trained quantum V3 agents
on:
  pull_request:
    paths: ['integration/quantum3/**', 'integration/qml_qrl/cli.mjs', 'bbyq.mjs', '.github/workflows/quantum-v3-integration.yml']
  push:
    branches: [main]
    paths: ['integration/quantum3/**', 'integration/qml_qrl/cli.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: 08c363e6c6855c14026c86046af7183a45f45a98
          path: deps/reverse
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile original XI runtime
        run: bash deps/reverse/scripts/build-xi-session.sh deps/mundo-x deps/reverse/build
      - name: Check real trained models, root CLI and continued native learning
        env:
          BBYQ_QUANTUM_RUNTIME: ${{ github.workspace }}/deps/reverse
          BBYQ_TEST_CANONICAL_CLI: '1'
        run: node --test integration/quantum3/tests/launcher.test.mjs
      - name: Preserve circuit and simulator scope
        run: |
          python - <<'PY'
          import gzip,hashlib,json
          from pathlib import Path
          root=Path('integration/quantum3/release')
          m=json.loads((root/'manifest.json').read_text())
          data=gzip.decompress((root/m['file']).read_bytes())
          assert hashlib.sha256(data).hexdigest()==m['checkpoint_sha256']
          assert m['model_identifier']==173
          assert m['training_episodes_per_agent']==10000
          assert m['legacy_training_episodes_per_agent']==800
          PY
