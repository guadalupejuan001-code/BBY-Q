name: BBY Q unified native entity
on:
  pull_request:
    paths: ['bbyq', 'integration/unified/**', 'ai/xi/unified/**', '.github/workflows/bbyq-unified.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: 08c363e6c6855c14026c86046af7183a45f45a98
          path: deps/reverse-pc
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Build XI host runtime
        run: bash deps/reverse-pc/scripts/build-xi-session.sh deps/mundo-x deps/reverse-pc/build
      - name: Verify frozen models, original C1 and unified entity
        run: |
          python3 integration/sequence2/verify_release.py
          python3 -m integration.unified.verify_release
          python3 -m integration.unified.verify
          python3 -m integration.unified.evaluate --count 24 --workers 2 --integration-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBYQ-unified-native-evidence
          path: build/unified/*.json
          if-no-files-found: warn
          retention-days: 30
