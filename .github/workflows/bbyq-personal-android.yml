name: BBY Q personal Android APK
on:
  pull_request:
    paths: ['android-personal/**', 'ai/personal/**', 'ai/xi/qchat100/**', 'ai/xi/qmemory/**', 'ai/xi/quantum3/**', 'ai/xi/balance/**', 'integration/balance/**', '.github/workflows/bbyq-personal-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: 08c363e6c6855c14026c86046af7183a45f45a98
          path: deps/reverse-pc
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/mundo-X
          ref: e2778d962af22f6f1a0794058dd4685fc2573966
          path: deps/mundo-x
          persist-credentials: false
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Restore the real preserved models and test the native chat
        run: |
          bash deps/reverse-pc/scripts/build-xi-session.sh deps/mundo-x deps/reverse-pc/build
          python3 deps/reverse-pc/scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          python3 android-personal/scripts/prepare-assets.py
          python3 android-personal/scripts/test-engine.py
          node android-personal/scripts/test-unified-native.mjs
          python3 integration/balance/verify.py
      - name: Install Android tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' 'platform-tools' 'emulator' 'system-images;android-35;default;x86_64'
      - name: Build standalone Android APK and native ARM64 library
        run: |
          gradle -p android-personal --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest > android-personal/build.log 2>&1 || { tail -160 android-personal/build.log; exit 1; }
      - name: Android 15 native conversations, persistent learning and real chat UI
        timeout-minutes: 18
        run: bash android-personal/scripts/emulator-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBYQ-X-personal-Android
          path: |
            build/personal-artifacts/
            build/personal-host/evidence.json
            build/unified-native-checks.json
            build/balance-release-checks.json
            android-personal/build.log
          if-no-files-found: warn
          retention-days: 30
