name: BBY Q E025 recovered release
on:
  push:
    branches: [main]
    paths: ['ai/releases/e025/**', 'ai/xi/w4u/**', '.github/workflows/bbyq-e025.yml']
  pull_request:
    paths: ['ai/releases/e025/**', 'ai/xi/w4u/**', '.github/workflows/bbyq-e025.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e025:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: a1b935ae0adf38615996bac92727e95289ad7cc1
          path: deps/reverse
          persist-credentials: false
      - name: Build pinned owner runtime
        run: |
          set -euo pipefail
          bash deps/reverse/scripts/setup-ether.sh
          cd deps/reverse
          mkdir -p build
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc src/reverse_pc.cpp -o build/reverse_pc
      - name: Recompile XI, reproduce the exact capsule and test E025 and W4u
        run: |
          set -euo pipefail
          python3 ai/releases/e025/test.py deps/reverse/build/reverse_pc evidence/e025
          node ai/xi/w4u/tests/native-w4u.mjs deps/reverse/build/reverse_pc evidence/w4u
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBY-Q-E025-W4u-0.1
          path: |
            evidence/e025/BBY-Q.rxe
            evidence/e025/W4u.rxe
            evidence/e025/verification.json
            evidence/e025/tests.json
            evidence/w4u/results.json
