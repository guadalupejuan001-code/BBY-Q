name: BBY Q consolidated historical sources E026-E034 native reproduction
on:
  pull_request:
    paths: ['.github/workflows/bbyq-consolidation.yml', 'ai/releases/e026/**', 'ai/releases/e027/**', 'ai/releases/e034/**', 'ai/releases/e033/**', 'ai/releases/e032/**', 'ai/releases/e031/**', 'ai/releases/e030/**', 'docs/AI_E030_LEARNED_FRAMES.md', 'ai/releases/e029/**', 'docs/AI_E029_NATURAL_INTAKE.md', '.github/workflows/bbyq-e029.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bbyq-consolidation-${{ github.head_ref || github.ref }}
  cancel-in-progress: false
jobs:
  native-e029:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: guadalupejuan001-code/REVERSE-PC
          ref: a1b935ae0adf38615996bac92727e95289ad7cc1
          path: deps/reverse
          persist-credentials: false
      - name: Build pinned XI/Ether runtime
        run: |
          set -euo pipefail
          bash deps/reverse/scripts/setup-ether.sh
          cd deps/reverse
          mkdir -p build
          python3 scripts/prepare-ether-compat.py deps/mundo-x build/ether-compat
          g++ -std=c++17 -O2 -pthread -DREVERSE_PC_HAVE_BOUNDED_PRODUCT_IMPORT=1 -Ibuild/ether-compat -Ideps/mundo-x/native/include -Isrc src/reverse_pc.cpp -o build/reverse_pc
      - name: Assert historical sources E026 to E034 are present and E025 checkpoint preserved
        run: |
          set -euo pipefail
          for version in e026 e027 e030 e031 e032 e033 e034; do test -d "ai/releases/$version"; done
          test -f ai/checkpoints/e034/composition-model.rvp.gz.b64
          sha256sum ai/releases/e034/relations.xi ai/releases/e033/relations.xi ai/releases/e032/temporal.xi
      - name: Original E025 and W4u native regressions
        run: |
          set -euo pipefail
          python3 ai/releases/e025/test.py deps/reverse/build/reverse_pc evidence/e025
          node ai/xi/w4u/tests/native-w4u.mjs deps/reverse/build/reverse_pc evidence/w4u
      - name: Recover exact tested E032 capsule and source
        uses: actions/download-artifact@v4
        with:
          name: BBYQ-E032-native-temporal-learning
          run-id: 40795445276
          github-token: ${{ github.token }}
          path: prior
      - name: Recover verified E033 source and capsule
        uses: actions/download-artifact@v4
        with:
          name: BBYQ-E033-minimal-relations
          run-id: 40802286565
          github-token: ${{ github.token }}
          path: prior033
      - name: Build relational composition and verify parent
        run: python3 ai/releases/e034/build.py deps/reverse/build/reverse_pc prior033 evidence/composition
      - name: Teach eight forms and examine reserved stories plus retention
        run: python3 ai/releases/e034/test.py deps/reverse/build/reverse_pc prior033 evidence/composition
      - name: Reproduce E033 stress and capacity tests as verification
        run: |
          mkdir -p evidence/minimal
          cp evidence/composition/composed.rxe evidence/minimal/minimal.rxe
          python3 ai/releases/e034/retention-e033.py deps/reverse/build/reverse_pc prior evidence/minimal
      - name: Restore historical regression harnesses without re-teaching production models
        run: |
          set -euo pipefail
          node ai/releases/e027/build.mjs deps/reverse/build/reverse_pc evidence/legacy027
          node ai/releases/e028/build.mjs deps/reverse/build/reverse_pc evidence/legacy028
          mkdir -p evidence/compat evidence/compat-e029
          cp evidence/composition/composed.rxe evidence/compat/candidate.rxe
          cp evidence/composition/composed.rxe evidence/compat/dictionary.rxe
          cp evidence/composition/learned-model.rvp evidence/compat/controller.rvp
          cp evidence/composition/composed.rxe evidence/compat-e029/natural.rxe
          cp evidence/legacy028/candidate.rxe evidence/compat-e029/candidate.rxe
          cp evidence/composition/learned-model.rvp evidence/compat-e029/controller.rvp
      - name: Complete archive, grounding, intake and old-agent regressions on learned model
        run: |
          set -euo pipefail
          node ai/releases/e027/test.mjs deps/reverse/build/reverse_pc evidence/compat evidence/regression027
          node ai/releases/e028/test.mjs deps/reverse/build/reverse_pc evidence/compat evidence/legacy027 evidence/regression028
          node ai/releases/e029/test.mjs deps/reverse/build/reverse_pc evidence/compat-e029 evidence/regression029
          python3 ai/releases/e031/regression.py deps/reverse/build/reverse_pc evidence/compat evidence/candidate-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BBYQ-E034-relational-composition
          path: |
            evidence
            !evidence/minimal/dictionary-smoke/banks/**
