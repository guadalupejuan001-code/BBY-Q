name: W4u native XI work engine
on:
  push:
    branches: [main]
    paths: ['ai/xi/w4u/**', '.github/workflows/w4u.yml']
  pull_request:
    paths: ['ai/xi/w4u/**', '.github/workflows/w4u.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  w4u:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned owner runtime
        run: |
          set -eu
          git clone --no-checkout https://github.com/guadalupejuan001-code/REVERSE-PC.git "$RUNNER_TEMP/reverse-pc"
          git -C "$RUNNER_TEMP/reverse-pc" checkout --detach 6d4de14a2dfbce4b8a7f1cb50e29d11b9073fe98
          bash "$RUNNER_TEMP/reverse-pc/scripts/setup-ether.sh"
          cmake -S "$RUNNER_TEMP/reverse-pc" -B "$RUNNER_TEMP/reverse-pc-build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/reverse-pc-build" --target reverse_pc --parallel 2
      - name: Test three roles, postconditions and corrupted proposals
        run: node ai/xi/w4u/tests/native-w4u.mjs "$RUNNER_TEMP/reverse-pc-build/reverse_pc" evidence/w4u
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w4u-native-evidence
          path: evidence/w4u/results.json
