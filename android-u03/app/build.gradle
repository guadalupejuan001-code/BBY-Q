plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.bbyq.u03'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.bbyq.u03.training'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName 'U03.18.0-personal'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -fexceptions -frtti' } }
    }
    androidResources { noCompress += ['zip'] }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    packaging { resources { excludes += ['META-INF/*.kotlin_module'] } }
}
chaquopy { defaultConfig { version = '3.12'; buildPython('python3.12') } }
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

