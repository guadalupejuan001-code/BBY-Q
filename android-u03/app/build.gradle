plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
android {
    namespace 'com.bbyq.u03'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'com.bbyq.u03.training'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName 'U03.19.0-chats'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -fexceptions -frtti' } }
    }
    androidResources { noCompress += ['zip'] }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    if (project.hasProperty('bbyqCiKeystorePath')) {
        signingConfigs.debug {
            storeFile file(project.property('bbyqCiKeystorePath'))
            storeType 'PKCS12'
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging { resources { excludes += ['META-INF/*.kotlin_module'] } }
}
chaquopy { defaultConfig { version = '3.12'; buildPython('python3.12') } }
configurations {
    c18TestKotlin {
        canBeConsumed = false
        transitive = false
    }
}
dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    // The test APK also runs against C18, whose app APK has no Kotlin runtime.
    // A file dependency keeps AGP from filtering this copy as an app module.
    c18TestKotlin 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
    androidTestImplementation files(configurations.c18TestKotlin)
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

